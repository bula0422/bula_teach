<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-label="算術練習">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#eef7f5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#2a261f" flood-opacity=".14"/>
    </filter>
    <filter id="chipShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="5" flood-color="#2a261f" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="420" height="280" rx="22" fill="url(#bg)"/>
  <circle cx="70" cy="58" r="52" fill="#f4b043" opacity=".16"/>
  <circle cx="348" cy="72" r="54" fill="#d94f7d" opacity=".12"/>
  <circle cx="248" cy="226" r="68" fill="#15736a" opacity=".11"/>

  <rect x="38" y="36" width="344" height="206" rx="22" fill="url(#panel)" stroke="#d8d0c1" stroke-width="2" filter="url(#panelShadow)"/>
  <path d="M70 204 C120 178 175 212 230 190 C274 173 310 184 350 206" fill="none" stroke="#3478c6" stroke-width="6" stroke-linecap="round" opacity=".18"/>
  <path d="M54 76 C88 50 126 49 152 72" fill="none" stroke="#f4b043" stroke-width="8" stroke-linecap="round" opacity=".16"/>
  <path d="M286 66 C322 44 354 50 374 82" fill="none" stroke="#d94f7d" stroke-width="8" stroke-linecap="round" opacity=".14"/>

  <g font-family="Arial Rounded MT Bold, Arial, sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="middle">
    <g transform="translate(92 82) rotate(-9)" filter="url(#chipShadow)">
      <rect x="-40" y="-40" width="80" height="80" rx="18" fill="#f4a83d"/>
      <text y="0" font-size="56" fill="#fff">1</text>
    </g>
    <g transform="translate(198 62) rotate(7)" filter="url(#chipShadow)">
      <rect x="-38" y="-38" width="76" height="76" rx="17" fill="#15736a"/>
      <text y="0" font-size="54" fill="#fff">＋</text>
    </g>
    <g transform="translate(314 92) rotate(-6)" filter="url(#chipShadow)">
      <rect x="-40" y="-40" width="80" height="80" rx="18" fill="#3478c6"/>
      <text y="0" font-size="56" fill="#fff">2</text>
    </g>
    <g transform="translate(106 190) rotate(8)" filter="url(#chipShadow)">
      <rect x="-37" y="-37" width="74" height="74" rx="17" fill="#de6b4f"/>
      <text y="0" font-size="58" fill="#fff">−</text>
    </g>
    <g transform="translate(214 156) rotate(-3)" filter="url(#chipShadow)">
      <rect x="-42" y="-42" width="84" height="84" rx="19" fill="#7b62b3"/>
      <text y="0" font-size="56" fill="#fff">3</text>
    </g>
    <g transform="translate(320 190) rotate(11)" filter="url(#chipShadow)">
      <rect x="-38" y="-38" width="76" height="76" rx="18" fill="#2c9c7d"/>
      <text y="0" font-size="56" fill="#fff">×</text>
    </g>
    <g transform="translate(206 226) rotate(5)" filter="url(#chipShadow)">
      <rect x="-36" y="-36" width="72" height="72" rx="17" fill="#d94f7d"/>
      <text y="0" font-size="49" fill="#fff">÷</text>
    </g>
  </g>
</svg>