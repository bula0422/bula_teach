<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7056a3"><meta name="apple-mobile-web-app-capable" content="yes"><title>思考小教室 - Bula Teach</title><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><link rel="stylesheet" href="./thinking.css"></head>
<body><main class="thinking-shell"><header class="topbar"><a class="round-button" href="../" aria-label="返回主選單">‹</a><div><small>Bula Teach</small><h1>思考小教室</h1></div><span class="bulb" aria-hidden="true">💡</span></header>
<section class="difficulty-screen" id="difficultyScreen"><div class="intro"><p>閱讀文字、找出線索，動動腦找答案！</p><h2>選擇難度</h2></div><div class="difficulty-grid"><button class="difficulty-card easy" type="button" data-level="easy"><span>🌱</span><strong>簡單</strong><small>直接線索與一步思考</small></button><button class="difficulty-card medium" type="button" data-level="medium"><span>🌿</span><strong>中等</strong><small>兩個線索與兩步計算</small></button><button class="difficulty-card hard" type="button" data-level="hard"><span>🌳</span><strong>困難</strong><small>多重條件與綜合推理</small></button></div></section>
<section class="question-screen is-hidden" id="questionScreen" aria-live="polite"><article class="question-card"><div class="question-head"><button class="back-button" id="backButton" type="button">‹ 返回難度</button><strong id="difficultyLabel"></strong><button class="speak-button" id="speakButton" type="button" aria-label="朗讀題目">🔊 朗讀</button></div><div class="question-body"><span class="mode-badge" id="modeBadge"></span><p class="passage" id="passage"></p><h2 id="prompt"></h2><div class="answer-grid" id="answerGrid"></div><div class="feedback is-hidden" id="feedback" role="status"><strong id="feedbackTitle"></strong><p id="feedbackText"></p></div></div><div class="question-actions"><button class="next-button is-hidden" id="nextButton" type="button">下一題 ›</button></div></article></section></main><script src="./thinking.js"></script></body></html>
