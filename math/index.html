<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>算術練習</title>
    <link rel="stylesheet" href="./math.css" />
  </head>
  <body>
    <main class="app">
      <aside class="controls" aria-label="題型設定">
        <div class="brand">
          <h1>算術練習</h1>
          <p>選一種題型，一次練習一題</p>
        </div>

        <section class="mode is-open" data-mode="add">
          <button class="mode-head" type="button">加法</button>
          <div class="mode-body">
            <label>加數位數 <input id="addDigits" type="number" min="1" max="4" value="2" /></label>
            <button class="generate-mode" type="button" data-generate="add">開始加法</button>
          </div>
        </section>

        <section class="mode" data-mode="sub">
          <button class="mode-head" type="button">減法</button>
          <div class="mode-body">
            <label>數字位數 <input id="subDigits" type="number" min="1" max="4" value="2" /></label>
            <button class="generate-mode" type="button" data-generate="sub">開始減法</button>
          </div>
        </section>

        <section class="mode" data-mode="mul">
          <button class="mode-head" type="button">乘法</button>
          <div class="mode-body split">
            <label>第一個數 <input id="mulLeftDigits" type="number" min="1" max="3" value="2" /></label>
            <label>第二個數 <input id="mulRightDigits" type="number" min="1" max="3" value="1" /></label>
            <button class="generate-mode" type="button" data-generate="mul">開始乘法</button>
          </div>
        </section>

        <section class="mode" data-mode="div">
          <button class="mode-head" type="button">除法</button>
          <div class="mode-body split">
            <label>商的位數 <input id="divQuotientDigits" type="number" min="1" max="3" value="2" /></label>
            <label>除數位數 <input id="divisorDigits" type="number" min="1" max="2" value="1" /></label>
            <button class="generate-mode" type="button" data-generate="div">開始除法</button>
          </div>
        </section>

        <section class="mode" data-mode="mixed">
          <button class="mode-head" type="button">綜合運算</button>
          <div class="mode-body split">
            <label>數字位數 <input id="mixedDigits" type="number" min="1" max="3" value="1" /></label>
            <label>運算長度 <input id="mixedTerms" type="number" min="3" max="6" value="4" /></label>
            <button class="generate-mode" type="button" data-generate="mixed">開始綜合</button>
          </div>
        </section>

        <div class="sidebar-bottom">
          <div class="stats" id="statsBox"></div>
          <section class="settings-box">
            <button class="mode-head" id="settingsToggle" type="button">設定</button>
            <div class="settings-body" id="settingsBody">
              <button class="secondary-action" id="clearStatsButton" type="button">清除統計</button>
            </div>
          </section>
        </div>
      </aside>

      <section class="preview-shell" aria-label="試卷預覽">
        <div class="paper" id="paper">
          <canvas class="paper-canvas" id="paperCanvas" aria-label="手寫計算區"></canvas>
          <div class="single-problem" id="problemArea"></div>
        </div>
        <button class="floating erase" id="eraseButton" type="button" aria-label="清除手寫" title="清除手寫">↺</button>
        <button class="floating finish" id="finishButton" type="button">作答完成</button>
        <div class="result" id="resultBox" aria-live="polite">
          <span id="resultText"></span>
          <button id="nextButton" type="button">下一題</button>
        </div>
      </section>
    </main>

    <script src="./math.js"></script>
  </body>
</html>
