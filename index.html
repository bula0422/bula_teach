<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bula Teach" />
    <title>Bula Teach</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="home-screen" id="homeScreen">
      <section class="home-hero">
        <div class="brand home-brand">
          <img class="home-icon" src="./app-icon.png" alt="" />
          <div>
            <h1>Bula Teach</h1>
            <p id="offlineStatus">準備中</p>
          </div>
        </div>
        <div class="launcher-grid" aria-label="功能選單">
          <a class="launcher-card" href="./copybook/">
            <span class="launcher-visual image-visual"><img src="./assets/menu-copybook.svg" alt="" /></span>
            <span class="launcher-copy">
              <strong>描寫練習</strong>
              <small>注音、字母、國字、英文單字</small>
            </span>
          </a>
          <a class="launcher-card" href="./math/">
            <span class="launcher-visual image-visual"><img src="./assets/menu-math.svg" alt="" /></span>
            <span class="launcher-copy">
              <strong>算術練習</strong>
              <small>加減乘除與手寫計算</small>
            </span>
          </a>
          <a class="launcher-card game-launcher" href="./games/">
            <span class="launcher-visual image-visual"><img src="./assets/menu-games.svg" alt="" /></span>
            <span class="launcher-copy"><strong>數字探險島</strong><small>益智闖關、圖形規律與數學冒險</small></span>
          </a>
        </div>
      </section>
    </main>

    <script src="./home.js"></script>
  </body>
</html>
