<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bula Teach" />
    <title>Bula Teach</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="教材">
        <div class="brand">
          <span class="brand-mark">字</span>
          <div>
            <h1>Bula Teach</h1>
            <p id="offlineStatus">準備中</p>
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="教材分類">
          <button class="tab is-active" data-filter="all" type="button">全部</button>
          <button class="tab" data-filter="chinese" type="button">中文</button>
          <button class="tab" data-filter="bopomofo" type="button">注音</button>
          <button class="tab" data-filter="english" type="button">英文</button>
        </div>

        <div class="lesson-list" id="lessonList" aria-label="字卡清單"></div>
      </aside>

      <section class="workspace" aria-label="描寫練習">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="itemType">中文</p>
            <h2 id="itemTitle">我</h2>
          </div>
          <div class="actions">
            <button class="icon-button" id="speakButton" type="button" aria-label="播放發音" title="播放發音">
              <span aria-hidden="true">▶</span>
            </button>
            <button class="icon-button" id="clearButton" type="button" aria-label="清除筆跡" title="清除筆跡">
              <span aria-hidden="true">↺</span>
            </button>
            <button class="text-button" id="doneButton" type="button">完成</button>
          </div>
        </header>

        <div class="trace-stage">
          <div class="guide-lines" aria-hidden="true"></div>
          <div class="trace-text" id="traceText" aria-hidden="true">我</div>
          <canvas id="traceCanvas" aria-label="描寫區"></canvas>
        </div>

        <footer class="study-bar">
          <button class="nav-button" id="prevButton" type="button">上一個</button>
          <div class="study-info">
            <strong id="hintText">ㄨㄛˇ</strong>
            <span id="meaningText">I / me</span>
          </div>
          <button class="nav-button" id="nextButton" type="button">下一個</button>
        </footer>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
