<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#39796a"><meta name="apple-mobile-web-app-capable" content="yes"><title>數字探險島 - Bula Teach</title><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><link rel="stylesheet" href="./games.css"></head>
<body><main class="game-shell"><header class="topbar"><a class="round-button" href="../" aria-label="返回主選單">‹</a><div class="title-lockup"><span class="mascot">🦊</span><div><small>Bula Teach</small><h1>數字探險島</h1></div></div><div class="score-pill" aria-label="獲得的星星"><span>⭐</span><strong id="totalStars">0</strong><span>/ 90</span></div><button class="round-button sound-button" id="soundButton" type="button" aria-label="關閉音效">🔊</button></header>
<section class="map-screen" id="mapScreen" aria-label="探險地圖"><div class="map-welcome"><strong>準備好探險了嗎？</strong><span>完成關卡，沿著小路前往故事城堡！</span></div><div class="level-path" id="levelPath"></div><button class="reset-button" id="resetButton" type="button">重新開始冒險</button></section>
<section class="play-screen is-hidden" id="playScreen" aria-live="polite"><div class="play-card"><div class="play-head"><button class="map-button" id="mapButton" type="button">‹ 回地圖</button><div class="level-heading"><span id="worldBadge"></span><strong id="levelTitle"></strong></div><div class="progress-dots" id="progressDots" aria-label="題目進度"></div></div><div class="question-area"><div class="scene-art" id="sceneArt" aria-hidden="true"></div><p class="question-label" id="questionLabel"></p><div class="question-visual" id="questionVisual"></div><div class="answer-grid" id="answerGrid"></div><p class="helper-text" id="helperText">選出正確答案</p></div><div class="play-actions"><button class="soft-button" id="hintButton" type="button">💡 提示</button><span>連續答對 <strong id="streakCount">0</strong> 題</span></div></div></section></main>
<dialog class="result-dialog" id="resultDialog"><div class="result-burst" aria-hidden="true">🎉</div><p class="eyebrow">關卡完成</p><h2 id="resultTitle"></h2><div class="result-stars" id="resultStars" aria-label="本關星等"></div><p id="resultMessage"></p><div class="result-actions"><button class="soft-button" id="retryButton" type="button">再玩一次</button><button class="primary-button" id="nextButton" type="button">下一關</button></div></dialog><script src="./games.js"></script></body></html>
