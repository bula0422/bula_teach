<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#22352f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bula Teach" />
    <title>益智小遊戲 - Bula Teach</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <link rel="stylesheet" href="./games.css" />
  </head>
  <body>
    <main class="game-app">
      <header class="game-topbar" aria-label="遊戲工具列">
        <a class="back-button" href="../" aria-label="返回主選單">‹</a>
        <div class="game-title">
          <span>益智小遊戲</span>
          <strong>記憶配對</strong>
        </div>

        <form class="game-controls" aria-label="記憶配對設定">
          <label>
            <span>組數</span>
            <select id="pairCount">
              <option value="4">4</option>
              <option value="6" selected>6</option>
              <option value="8">8</option>
            </select>
          </label>
          <label>
            <span>主題</span>
            <select id="deckTheme">
              <option value="bopomofo">注音</option>
              <option value="numbers">數字</option>
              <option value="shapes">圖形</option>
            </select>
          </label>
          <button class="new-game-button" id="newGameButton" type="button">重新開始</button>
        </form>
      </header>

      <section class="play-area" aria-label="記憶配對遊戲">
        <div class="message-strip" id="gameMessage">翻開兩張相同卡片完成配對</div>
        <div class="memory-grid" id="memoryGrid" aria-label="記憶卡片"></div>
      </section>

      <footer class="game-stats" aria-label="遊戲統計">
        <div>
          <span>翻牌次數</span>
          <strong id="moveCount">0</strong>
        </div>
        <div>
          <span>已完成</span>
          <strong id="matchCount">0 / 6</strong>
        </div>
        <div>
          <span>最佳紀錄</span>
          <strong id="bestScore">--</strong>
        </div>
      </footer>
    </main>

    <script src="./games.js"></script>
  </body>
</html>
